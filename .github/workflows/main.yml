name: Upload changed files to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    # A nivel de job para que el `if:` del paso de invalidacion pueda leerlo:
    # el contexto `secrets` no esta disponible dentro de un `if:` de paso.
    env:
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build site
      run: npm run build   # tsc + vite build -> genera dist/

    - name: Diagnose credentials (temporal)
      # No imprime los valores, solo su forma: longitud, prefijo del key id
      # y presencia de espacios. Suficiente para distinguir "mal pegado"
      # de "key invalida de origen".
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        echo "ACCESS_KEY_ID : len=${#AWS_ACCESS_KEY_ID} (esperado 20)  prefijo=${AWS_ACCESS_KEY_ID:0:4}"
        echo "SECRET_KEY    : len=${#AWS_SECRET_ACCESS_KEY} (esperado 40)"
        case "$AWS_ACCESS_KEY_ID" in *[[:space:]]*) echo "AVISO: el ACCESS_KEY_ID tiene espacios/saltos de linea" ;; esac
        case "$AWS_SECRET_ACCESS_KEY" in *[[:space:]]*) echo "AVISO: el SECRET tiene espacios/saltos de linea" ;; esac

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Sync dist to S3
      # El contenido de dist/ queda en la raiz del mismo prefijo de siempre:
      # dist/index.html -> s3://$AWS_S3_BUCKET/index.html
      run: aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}" --delete

    - name: Invalidate CloudFront
      # Sin esto el deploy queda invisible: CloudFront cachea una variante por
      # Accept-Encoding y la comprimida (la que pide todo navegador) sigue
      # sirviendo lo viejo hasta que expire su TTL.
      # Se salta solo si todavia no existe el secret, para no romper el deploy.
      if: env.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
          --paths "/*"
