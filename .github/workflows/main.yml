name: Upload changed files to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    # A nivel de job para que el `if:` del paso de invalidacion pueda leerlo:
    # el contexto `secrets` no esta disponible dentro de un `if:` de paso.
    env:
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      # Destino del sync. Acepta "mi-bucket", "mi-bucket/mi-prefijo"
      # o la URI completa "s3://mi-bucket/mi-prefijo".
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Validate config
      # Falla temprano y con un mensaje claro: sin destino, `aws s3 sync`
      # abortaria recien al final con un error cripto de URI invalida.
      run: |
        if [ -z "$AWS_S3_BUCKET" ]; then
          echo "::error::Falta la variable AWS_S3_BUCKET (Settings > Environments > production > Variables)."
          exit 1
        fi
        # Normaliza a una URI valida: el prefijo s3:// es opcional al
        # configurar la variable, y la barra final la exige `aws s3 sync`.
        DEST="$AWS_S3_BUCKET"
        case "$DEST" in s3://*) ;; *) DEST="s3://$DEST" ;; esac
        case "$DEST" in */) ;; *) DEST="$DEST/" ;; esac
        echo "S3_DEST=$DEST" >> "$GITHUB_ENV"
        echo "Destino del deploy: $DEST"

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build site
      run: npm run build   # tsc -b + vite build -> genera dist/

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

    - name: Sync dist to S3
      # El contenido de dist/ queda en la raiz del prefijo configurado:
      # dist/index.html -> $S3_DEST/index.html
      run: aws s3 sync dist/ "$S3_DEST" --delete

    - name: Invalidate CloudFront
      # Sin esto el deploy queda invisible: CloudFront cachea una variante por
      # Accept-Encoding y la comprimida (la que pide todo navegador) sigue
      # sirviendo lo viejo hasta que expire su TTL.
      # Se salta solo si todavia no existe el secret, para no romper el deploy.
      if: env.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
          --paths "/*"
